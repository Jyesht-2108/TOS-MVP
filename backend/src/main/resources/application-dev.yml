spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          use_get_generated_keys: true
        globally_quoted_identifiers: false
        globally_quoted_identifiers_skip_column_definitions: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/tos_db?stringtype=unspecified
    username: postgres
    password: "123456"

# CORS Configuration for mobile app and frontend
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173,http://10.0.2.2:8080,http://localhost:8080

logging:
  level:
    com.school.transport: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
